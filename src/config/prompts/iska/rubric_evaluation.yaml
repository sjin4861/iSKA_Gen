
# 루브릭 기반 지문 평가 프롬프트 (RM_Experiment_v1.0.0.md 기준)

rubric_evaluation:

# ==================================================
# Ⅰ. 읽고 말하기 (지문) 평가 프롬프트
# ==================================================
  completeness_for_guideline_1: |
    다음 [지문]을 바탕으로 생성된 [문항]이, 아래 [평가 목표 1]을 충실히 반영하고 있는지 평가해주세요.
    
    [지문]:
    {passage}

    [생성된 문항]:
    {stem1}
    
    [평가 목표 1]:
    - {problem_type1}: {eval_goal1}
    
    판정 기준:
    - PASS: 생성된 문항이 지문 내용을 바탕으로 [평가 목표 1]을 정확하게 평가하고 있음
    - FAIL: 생성된 문항이 [평가 목표 1]과 관련이 없거나, 지문 내용만으로 답할 수 없음
    
    답변은 "PASS" 또는 "FAIL"로 시작하고, 그 다음에 상세한 이유를 설명해주세요.

  completeness_for_guideline_2: |
    다음 [지문]을 바탕으로 생성된 [문항]이, 아래 [평가 목표 2]를 충실히 반영하고 있는지 평가해주세요.
    
    [지문]:
    {passage}

    [생성된 문항]:
    {stem2}

    [평가 목표 2]:
    - {problem_type2}: {eval_goal2}
    
    판정 기준:
    - PASS: 생성된 문항이 지문 내용을 바탕으로 [평가 목표 2]를 정확하게 평가하고 있음
    - FAIL: 생성된 문항이 [평가 목표 2]와 관련이 없거나, 지문 내용만으로 답할 수 없음
    
    답변은 "PASS" 또는 "FAIL"로 시작하고, 그 다음에 상세한 이유를 설명해주세요.

  completeness_for_guideline_3: |
    다음 [지문]을 바탕으로 생성된 [문항]이, 아래 [평가 목표 3]를 충실히 반영하고 있는지 평가해주세요.
    
    [지문]:
    {passage}

    [생성된 문항]:
    {stem3}

    [평가 목표 3]:
    - {problem_type3}: {eval_goal3}
    
    판정 기준:
    - PASS: 생성된 문항이 지문 내용을 바탕으로 [평가 목표 3]을 정확하게 평가하고 있음
    - FAIL: 생성된 문항이 [평가 목표 3]와 관련이 없거나, 지문 내용만으로 답할 수 없음
    
    답변은 "PASS" 또는 "FAIL"로 시작하고, 그 다음에 상세한 이유를 설명해주세요.

  core_theme_clarity: |
    다음 한국어 지문이 하나의 통일되고 명확한 핵심 메시지를 전달하는지 평가해주세요.
    
    지문:
    {passage}
    
    평가 기준:
    - 지문을 한 문장으로 요약했을 때, 주제가 명확히 드러나는가?
    - 주제와 관련 없는 불필요한 정보가 포함되어 있지는 않은가?
    - 내용이 산만하거나 주제에서 벗어나는 부분이 있지는 않은가?
    
    판정 기준:
    - PASS: 하나의 명확한 핵심 메시지를 전달하며, 불필요한 정보가 없음
    - FAIL: 주제가 불명확하거나, 산만하거나, 불필요한 정보가 포함됨
    
    답변은 "PASS" 또는 "FAIL"로 시작하고, 그 다음에 상세한 이유를 설명해주세요.

  reference_groundedness: |
    다음 한국어 지문이 함께 제공된 참고 자료의 정보에만 근거하여 작성되었는지 평가해주세요.
    
    지문:
    {passage}
    참고 자료:
    {reference}
    
    평가 기준:
    - 지문에 포함된 모든 주장과 설명이 참고 자료에서 근거를 찾을 수 있는가?
    - 참고 자료에 없거나, 그 내용과 상충되는 내용이 포함되어 있지는 않은가?
    - 모델이 배경지식을 사용하여 참고 자료에 없는 내용을 추가한 것으로 의심되는 부분이 있지는 않은가?
    
    판정 기준:
    - PASS: 모든 내용이 참고 자료에 근거함
    - FAIL: 참고 자료에 없는 내용이 포함되거나, 상충되는 내용이 있음
    
    답변은 "PASS" 또는 "FAIL"로 시작하고, 그 다음에 상세한 이유를 설명해주세요.

  logical_flow_and_structure: |
    다음 한국어 지문이 도입-본론-결론의 명확한 구조를 가지고 있으며, 문장과 문단 간의 연결이 논리적으로 자연스러운지 평가해주세요.
    
    지문:
    {passage}
    
    평가 기준:
    - 첫 문장이 주제를 효과적으로 소개하고 있는가?
    - 접속어나 지시어가 올바르게 사용되어 문장 간의 관계를 명확히 보여주는가?
    - 문장과 문단 간의 연결이 논리적으로 자연스러운가?
    - 단순 정보 나열이 아닌가?
    
    판정 기준:
    - PASS: 도입-본론-결론 구조가 명확하고, 논리적으로 연결됨
    - FAIL: 구조가 불명확하거나, 논리적 연결이 부족함
    
    답변은 "PASS" 또는 "FAIL"로 시작하고, 그 다음에 상세한 이유를 설명해주세요.

  korean_quality: |
    다음 한국어 지문에 명백한 문법, 맞춤법, 띄어쓰기 오류가 없는지, 원어민이 읽었을 때 어색하거나 번역투로 느껴지는 표현이 없는지 평가해주세요.
    
    지문:
    {passage}
    
    평가 기준:
    - 주어와 서술어의 호응이 올바른가?
    - 문맥에 맞지 않는 어색한 어휘나 한자어가 사용되지는 않았는가?
    - 문법, 맞춤법, 띄어쓰기 오류가 없는가?
    - 원어민에게 어색하게 느껴지는 표현이 없는가?
    
    판정 기준:
    - PASS: 문법적으로 정확하고 자연스러운 한국어 표현
    - FAIL: 문법, 맞춤법, 띄어쓰기 오류 또는 어색한 표현이 있음
    
    답변은 "PASS" 또는 "FAIL"로 시작하고, 그 다음에 상세한 이유를 설명해주세요.

  l2_learner_suitability: |
    다음 한국어 지문의 어휘 수준과 문장 복잡도가 L2 학습자(중급~고급)에게 적절한지 평가해주세요.
    
    지문:
    {passage}
    
    평가 기준:
    - 지나치게 길거나 복잡한 문장 구조가 사용되지는 않았는가?
    - 별도의 설명 없이 이해하기 어려운 전문 용어나 배경지식이 필요한 내용은 없는가?
    - 학습자가 문맥만으로 의미를 추론하기 어려운 관용 표현이나 신조어가 사용되었는가?
    
    판정 기준:
    - PASS: L2 학습자가 이해하기 적절한 어휘와 문장 구조
    - FAIL: 지나치게 복잡하거나, 이해하기 어려운 표현/용어가 있음
    
    답변은 "PASS" 또는 "FAIL"로 시작하고, 그 다음에 상세한 이유를 설명해주세요.
  
# ==================================================
  # Ⅱ. 듣고 말하기 (오디오 대본) 평가 프롬프트
  # ==================================================
  # '평가 지침 완전성', '핵심 주제 명확성', '한국어 품질'은 지문용 프롬프트와 공유
  
  background_information_groundedness: |
    다음 [대화문]이 함께 제공된 [배경 정보]에만 근거하여 작성되었는지 평가해주세요.
    
    [대화문]:
    {dialogue}
    [배경 정보]:
    {reference}
    
    판정 기준:
    - PASS: 모든 대화 내용이 배경 정보에 근거함
    - FAIL: 배경 정보에 없는 내용이 포함되거나, 상충되는 내용이 있음
    
    답변은 "PASS" 또는 "FAIL"로 시작하고, 그 다음에 상세한 이유를 설명해주세요.

  dialogue_flow_and_structure: |
    다음 [대화문]이 '문제 제기 → 논거 제시 → 반박'의 자연스러운 흐름을 가지며, 화자 간의 상호작용이 논리적으로 연결되는지 평가해주세요.
    
    [대화문]:
    {dialogue}
    
    판정 기준:
    - PASS: 대화의 흐름이 자연스럽고, 화자 간 상호작용이 논리적임
    - FAIL: 대화의 흐름이 부자연스럽거나, 화자의 발언이 서로 동문서답하는 등 논리적 연결이 부족함
    
    답변은 "PASS" 또는 "FAIL"로 시작하고, 그 다음에 상세한 이유를 설명해주세요.

  spoken_language_suitability: |
    다음 [대화문]이 L2 학습자가 이해하기에 적절한 난이도의 자연스러운 구어체로 작성되었는지 평가해주세요.
    
    [대화문]:
    {dialogue}
    
    판정 기준:
    - PASS: L2 학습자가 이해하기 적절한 수준의 자연스러운 구어체임
    - FAIL: 지나치게 격식적이거나 문어적인 표현, 또는 이해하기 어려운 어휘가 사용됨
    
    답변은 "PASS" 또는 "FAIL"로 시작하고, 그 다음에 상세한 이유를 설명해주세요.

  # ==================================================
  # Ⅲ. 보고 말하기 (이미지 캡션/상황) 평가 프롬프트
  # ==================================================
  # '논리적 흐름', '한국어 품질', 'L2 학습자 적합성'은 지문용 프롬프트와 공유
  
  evaluation_goal_connectivity: |
    다음 [이미지 설명]과 [문제 상황]이, L2 학습자의 3가지 말하기 과제(묘사, 경험, 제안)를 모두 유도할 수 있도록 충분하고 균형 잡힌 정보를 포함하는지 평가해주세요.
    
    [이미지 설명]:
    {image_description}
    [문제 상황]:
    {problem_situation}
    
    판정 기준:
    - PASS: 3가지 말하기 과제를 모두 수행할 수 있도록 충분한 단서를 제공함
    - FAIL: 내용이 너무 단순하거나 편중되어, 3가지 과제를 모두 수행하기에 정보가 부족함
    
    답변은 "PASS" 또는 "FAIL"로 시작하고, 그 다음에 상세한 이유를 설명해주세요.

  core_problem_visualization: |
    다음 [이미지 설명]이 주어진 [주제]의 핵심 문제를 시각적으로 명확하게 드러내도록 장면을 기획했는지 평가해주세요.
    
    [주제]:
    {topic}
    [이미지 설명]:
    {image_description}
    
    판정 기준:
    - PASS: 주제의 핵심 문제가 시각적으로 명확히 드러나도록 장면을 효과적으로 묘사함
    - FAIL: 묘사된 장면이 주제의 핵심 문제를 제대로 반영하지 못하거나, 모호함
    
    답변은 "PASS" 또는 "FAIL"로 시작하고, 그 다음에 상세한 이유를 설명해주세요.

  creativity_and_specificity: |
    다음 [이미지 설명]이 이미지를 쉽게 상상할 수 있을 만큼 구체적이고 창의적인지 평가해주세요.
    
    [이미지 설명]:
    {image_description}
    
    판정 기준:
    - PASS: 인물, 배경, 행동 등이 구체적이고 흥미롭게 묘사됨
    - FAIL: 묘사가 너무 추상적이거나, 단편적이어서 장면을 상상하기 어려움
    
    답변은 "PASS" 또는 "FAIL"로 시작하고, 그 다음에 상세한 이유를 설명해주세요.