
# 루브릭 기반 지문 평가 프롬프트 (RM_Experiment_v1.0.0.md 기준)

rubric_evaluation:
# ==================================================
# Ⅰ. 읽고 말하기 (지문) 평가 프롬프트
# ==================================================
  completeness_for_guidelines: |
    # R1 평가 지침 완전성 (Goal1~3 동시 평가, Binary)

    ## 임무
    다음 [지문]과 세 개의 [문항]이, 각각 대응하는 [평가 목표]를 **모두** 충실히 반영하는지 판정하라.
    - 세 개 중 하나라도 불충분하면 전체 결과를 false로 한다.

    ## 판정 규칙(엄격)
    - PASS: 모든 문항이 지문 내용에 기반하여, 해당 평가 목표를 외부 지식 없이 평가 가능(비자명 단서 ≥1).
    - FAIL: 하나라도 목표와 무관, 지문만으로 답 불가, 모호함, 또는 다른 목표로 편중.
    
    ## 출력 형식
    [답변] "PASS" 또는 "FAIL"로 시작하고, 한 줄로 간단한 이유를 설명 (최대 100자)
   
    ## 입력
    [지문]
    {passage}

    [문항 및 평가 지침]
    1) 문항: {stem1}  
      평가 지침 1: {problem_type1} — {eval_goal1}

    2) 문항: {stem2}  
      평가 지침 2: {problem_type2} — {eval_goal2}

    3) 문항: {stem3}  
      평가 지침 3: {problem_type3} — {eval_goal3}

    ## 출력
    [답변]

    
  # ---------- R2. 핵심 주제 명확성 (Likert) ----------
  core_theme_clarity: |
    # R2 핵심 주제 명확성 (Binary O/X · 완화판)

    ## 임무
    [지문]이 일관되게 전개되는지 평가하라.

    ## 판정 기준(완화)
    - PASS:
      - 상위 주제가 한 문장으로 요약 가능하고, 문단/소주제가 그 상위 주제에 **명시적 연결(정의, 예시, 인과, 대비 등)**로 기여함
      - **복합 주제/소주제 다루기 허용**: 여러 측면을 다뤄도 상위 주제와의 관계가 드러나면 감점하지 않음
      - 1~2개의 가벼운 여담/배경 전개는 허용
    - FAIL:
      - 본론의 **주요 부분**이 상위 주제와 **연결되지 않거나** 서로 다른 주제가 **통합 없이 병렬**로 나열됨
      - 핵심 메시지가 끝까지 **파악되지 않음**(결론 불명확, 요지 산개)

    ## 출력 형식
    [답변] "PASS" 또는 "FAIL"로 시작하고, 한 줄로 간단한 이유를 설명 (최대 100자)

    ## 입력
    [지문]
    {passage}

    ## 출력
    [답변]

  # ---------- R3. 참고 자료 기반성 (Binary, 완화판) ----------
  reference_groundedness: |
    # R3 참고 자료 기반성 (Binary · 완화판)

    ## 임무
    [지문]이 함께 제공된 [참고 자료]와 **상충되지 않는 범위**에서 작성되었는지 평가하라.
    - 핵심은 **모순 금지**이며, 자료를 벗어난 **상세 수치·직접 인용·구체적 사실명시**를 특히 점검한다.

    ## 판정 기준(완화)
    - PASS:
      - 참고 자료와 **상충되는 진술이 없음**
      - 자료에서 **합리적으로 파생/요약/일반화**한 내용, 가벼운 배경 연결, **가능성/전망 수준의 서술**은 허용
      - 단, 아래 항목은 **자료에 있어야 함**:
        1) **정량 수치(%, 인원, 연도, 금액 등)**  
        2) **특정 인물·기관·지명·연도 등 고유명사 기반의 사실 주장**  
        3) **직접 인용문/인용부호(“ ”)**  
    - FAIL:
      - 참고 자료와 **내용이 상충**하거나, 위 1)~3) 요소를 **자료 없이 새로 제시**
      - 근거 없는 **단정적** 주장으로 자료 범위를 벗어나 **사실처럼** 단언

    ## 출력 형식
    [답변] "PASS" 또는 "FAIL"로 시작하고, 한 줄로 간단한 이유 설명 (최대 100자)

    ## 입력
    [지문]
    {passage}

    [참고 자료]
    {reference}

    ## 출력
    [답변]

  logical_flow_and_structure: |
    # R4 논리적 흐름 및 구조 (Binary O/X)

    ## 임무
    [지문]이 도입–본론–결론의 명확한 구조를 가지고 있으며, 문장·문단 간 연결이 자연스러운지 평가하라.

    ## 판정 기준(엄격)
    - PASS: 첫 문장이 주제를 효과적으로 소개하고, 접속어·지시어 사용이 적절하며, 문장/문단 간 연결이 논리적이고 자연스러움. 단순 나열 아님.
    - FAIL: 하나라도 구조 불명확, 논리적 연결 부족, 단순 나열이면 FAIL.

    ## 출력 형식
    [답변] "PASS" 또는 "FAIL"로 시작하고, 한 줄로 간단한 이유를 설명 (최대 100자)

    ## 입력
    [지문]
    {passage}

    ## 출력
    [답변]

  korean_quality: |
    # R5 한국어 품질 (Binary O/X)

    ## 임무
    [지문]의 문법·맞춤법·띄어쓰기·호응 및 표현 자연스러움을 평가하라.

    ## 판정 기준(엄격)
    - PASS: 문법·맞춤법·띄어쓰기 오류가 없고, 번역투나 어색한 표현 없이 자연스러움
    - FAIL: 하나라도 오류가 있거나, 원어민이 읽었을 때 어색한 표현·번역투가 포함되면 FAIL

    ## 출력 형식
    [답변] "PASS" 또는 "FAIL"로 시작하고, 한 줄로 간단한 이유를 설명 (최대 100자)

    ## 입력
    [지문]
    {passage}

    ## 출력
    [답변]

  l2_learner_suitability: |
    # R6 L2 학습자 응답 적합성 (Likert 1~5, content)

    ## 임무
    [지문]이 L2 학습자의 **응답 수행**에 적절한지 평가하라.

    ## 판단 기준(응답 관점)
    - (난이도) 어휘 수준·문장 길이·구문 복잡도가 과도하지 않은가?
    - (명료성) 전문 용어·암묵적 배경지식 의존을 피하고, 필요한 경우 간단한 정의/예시로 해소되는가?

    ## 척도 앵커
    5 매우 적절 / 4 대체로 적절(일부 어려움) / 3 가능하나 방해 요소 있음 / 2 어려운 요소 다수 / 1 매우 어려움

    ## 출력 형식
    [답변] 1~5 중 정수 1개 출력하고, 한 줄로 간단한 이유 설명 (최대 100자)

    ## 입력
    [지문]
    {passage}

    ## 출력
    [답변]

