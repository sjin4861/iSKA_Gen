# iSKA RM 훈련(듣고말하기)용 단일 지문 평가 프롬프트 (EMPG conversations)
# preference_eval_listening.yaml — 2025-08-18

preference_evaluation_listening:
  # 1) 평가 지침 완전성 (Content + Stems)
  completeness_for_guidelines: |
    아래 [대화]와 [문항 세트]가 주어집니다. 또한 이 과업의 [평가 지침]이 제공됩니다.
    당신의 임무는 발화 내용이 3가지 지침을 모두 충족하도록 충분하고 균형 잡힌 정보를 포함하는지,
    그리고 각 문항(stem)이 발화 내용에 근거해 **무리 없이 출제 가능한지**를 점검하는 것입니다.

    [평가 지침]
    - 문제 유형: {problem_type1}, {problem_type2}, {problem_type3}
    - 평가 목표: {eval_goal1}, {eval_goal2}, {eval_goal3}

    [평가 기준]
    - (충족성) 발화가 3가지 문제 유형 모두에 대해 **질문을 만들고 답하게 할** 핵심 정보(근거)를 고르게 포함하는가?
    - (정합성) 각 stem이 해당 문제 유형/평가 목표와 **정확히 대응**하며, 발화 정보만으로 답변이 가능한가?
    - (과잉/결손) 특정 과업에만 치우치거나, 잡담·군더더기로 본론 정보가 희석되면 감점.

    위 기준에 따라 [대화]의 지침 완전성과 [문항 세트]와의 정합성 여부를 평가하세요.


  # 2) 핵심 주제 명확성 (Content Only)
  clarity_of_core_theme: |
    아래 [대화]가 주어집니다.

    [평가 기준]
    - 서두에서 주제·상황 맥락이 분명히 제시되고, 이후 turns에서 **일관되게 유지**되는가?
    - 화제 전환이 빈번한 산만한 진행, 결론·요지 재확인 부재는 감점.
    - 말하기 스타일·길이 차이는 배제하고 **주제 집중도**만 본다.

    위 기준에 따라 [대화]가 하나의 **명확하고 일관된 핵심 메시지**를 중심으로 전개되는지 평가하세요.


  # 3) 참고 자료 기반성 (Content Only + 단일 Reference)
  reference_groundedness: |
    아래 [대화]와 [참고 자료]가 주어집니다.

    [참고 자료]
    - {reference}

    [판정 규칙(엄격)]
    - PASS: 참고 자료의 재서술/직접 파생 범위 내에서만 기술됨.
    - FAIL: 자료에 없는 사실·수치·사례·인용 추가, 과장/추정, 혹은 자료와 상충.

    위 기준에 따라 [대화]의 모든 진술이 [참고 자료] 범위 안에서 **직접 재서술/합리적 파생**되는지 엄격히 판정하세요.
    
  # 4) 대화 흐름 및 구조 (Logical Flow for Dialogue/Monologue) — Content Only
  logical_flow: |
    아래 [대화]가 주어집니다.

    [평가 기준]
    - 대화: 인사/제안/질문-응답/합의 등 **인접쌍(adjacency pair)**이 적절히 이어지는가?
    - 화자 전환 시 대명사·지시어·접속 표현으로 맥락이 자연스럽게 이어지는가?
    - 순서 뒤바뀜, 비약적 결론, 질문에 대한 부적절·부재 응답은 감점.

    위 기준에 따라 [대화]의 턴 전개와 연결의 자연스러움, 발화 구조의 완결성을 평가하세요.

  # 5) 한국어 품질 (Korean Quality for Spoken Style) — Content Only
  korean_quality: |
    아래 [대화]가 주어집니다.

    [평가 기준]
    - 조사·어미·높임·경어·반말 등 **발화 맥락에 맞는 말차림** 유지
    - 번역투/어색한 표현·부자연스러운 어순·군더더기 최소화
    - 문법/맞춤법(표기된 텍스트 기준), 의미 모호성·지시 대상 불명확·문장 파편화는 감점

    위 기준에 따라 [대화]의 구어체 한국어의 자연스러움과 정확성 관점에서 언어 품질을 평가하세요.

  # 6) L2 학습자 적합성 (Content + Stems)
  l2_learner_suitability: |
    아래 [대화]와 [문항 세트]가 주어집니다.
   
    [평가 기준]
    - (난이도) 어휘 수준·문장 길이·구문 복잡도가 과도하지 않은가? 구어체 축약·속담·은어 남용은 감점.
    - (명료성) 암묵적 배경지식 의존 없이 의미가 전달되는가? 필요한 경우 간단한 정의·예시로 해소되는가?
    - (문항 적합성) 각 stem이 **명확하고 과도한 추론을 요구하지 않으며**, 발화 근거로 답할 수 있는가?

    위 기준에 따라 [대화]와 [문항 세트]를 L2 한국어 학습자를 가정하여 적절한 난이도·표현·구조인지 평가하세요.
