# iSKA RM 훈련(보고 말하기/비주얼)용 단일 지문 평가 프롬프트 (EMPG conversations)
# preference_eval_visual.yaml — 2025-08-18

preference_evaluation_visual:
  # 1) 평가 지침 완전성 (Content + Stems)
  completeness_for_guidelines: |
    아래 [이미지 설명/상황 제시]과 [문항 세트]가 주어집니다. 또한 이 과업의 [평가 지침]이 제공됩니다.
    당신의 임무는 설명/상황이 3가지 지침을 모두 충족하도록, 시각 단서와 맥락 정보가 **충분하고 균형 있게** 포함되어 있는지,
    그리고 각 문항(stem)이 해당 정보에 근거해 **무리 없이 출제 가능한지**를 점검하는 것입니다.

    [평가 지침]
    - 문제 유형: {problem_type1}, {problem_type2}, {problem_type3}
    - 평가 목표: {eval_goal1}, {eval_goal2}, {eval_goal3}

    [평가 기준]
    - (충족성) 이미지의 핵심 요소(인물/사물/행동/장소/시간/상호작용)와 맥락이 3가지 문제 유형 모두를
      **질문-답변 가능** 상태로 담겨 있는가?
    - (정합성) 각 stem이 해당 문제 유형/평가 목표와 **정확히 대응**하며, 설명/상황 텍스트만으로 답변이 가능한가?
    - (과잉/결손) 불필요한 묘사로 분량을 소모하거나 핵심 단서가 비어 있으면 감점.
    - 길이나 문체 차이는 배제하고 **과업 충족성**만 본다.

    위 기준에 따라 [이미지 설명/상황 제시]의 지침 완전성과 [문항 세트]와의 정합성 여부를 평가하세요.


  # 2) 핵심 주제 명확성 (Content Only)
  clarity_of_core_theme: |
    아래 [이미지 설명/상황 제시]가 주어집니다.

    [평가 기준]
    - 주제(무엇을 보여주는가)가 도입부에서 분명하며 이후 묘사가 **주제 중심으로 유지**되는가?
    - 산만한 객체 나열, 부정확한 초점 전환, 결론/요지 불명확은 감점.
    - 분량·문체 차이는 배제하고 **주제 집중도**만 본다.

    위 기준에 따라 [이미지 설명/상황 제시]이 하나의 **명확한 시각적 핵심 주제**를 전개되는지 평가하세요.


  # 3) 참고 자료 기반성 (Content Only + 단일 Reference)
  reference_groundedness: |
    아래 [이미지 설명/상황 제시]와 [참고 자료]가 주어집니다.

    [참고 자료]
    - {reference}

    [판정 규칙(엄격)]
    - PASS: 참고 자료의 시각 단서와 텍스트 정보로 뒷받침되는 내용만 서술됨.
    - FAIL: 자료에 없는 사물/행동/인물 속성·수치·장소/시간·감정/의도 등 **환각** 추가, 혹은 자료와 상충.

    위 기준에 따라 [이미지 설명/상황 제시]이 [참고 자료] 범위 안에서 **직접 재서술/합리적 파생**되는지 엄격히 판정하세요.


  # 4) 시각적 구조·전개(재현 가능성) (Content Only)
  logical_flow: |
    아래 [이미지 설명/상황 제시]가 주어집니다.

    [평가 기준]
    - (구조) 장면의 전경→중경→후경, 혹은 인물/행동→배경/맥락 등의 **일관된 조직**이 있는가?
    - (전개) 위치·관계·행동의 변화가 접속 표현과 지시어로 자연스럽게 이어지는가?
    - (완결) 핵심 정보가 누락되거나 순서가 뒤섞여 **장면 재현**이 곤란하면 감점.
    
    위 기준에 따라 [이미지 설명/상황 제시]이 **재현 가능한 순서와 맥락**으로 조직되어 있는지, 전반적 구조의 완결성을 평가하세요.

  # 5) 한국어 품질 (Korean Quality for Visual Description) — Content Only
  korean_quality: |
    아래 [이미지 설명/상황 제시]가 주어집니다.

    [평가 기준]
    - 조사·어미·수식어 결합의 정확성, 중복·군더더기 최소화
    - 번역투/어색한 어순/과도한 수식 남용/파편 문장 감점
    - 지시 대상(이/그/저, 여기/저기)과 시공간 표현이 명료하지 않으면 감점

    위 기준에 따라 [이미지 설명/상황 제시]의 한국어의 정확성과 자연스러움을 평가하세요.

  # 6) L2 학습자 적합성 (Content + Stems)
  l2_learner_suitability: |
    아래 [이미지 설명/상황 제시]와 [문항 세트]가 주어집니다.
       [평가 기준]
    - (난이도) 어휘 수준·문장 길이·구문 복잡도가 과도하지 않은가? 관용구·은어·한자어 남용은 감점.
    - (명료성) 암묵적 배경지식 없이도 시각 단서가 이해되도록 설명되는가? 필요한 경우 간단한 정의/예시로 보완되는가?
    - (문항 적합성) 각 stem이 **명확하고 과도한 추론을 요구하지 않으며**, 텍스트 근거로 답할 수 있는가?

    위 기준에 따라 [이미지 설명/상황 제시]와 [문항 세트]를 L2 한국어 학습자를 가정하여 적절한 난이도·표현·구조인지 평가하세요.
