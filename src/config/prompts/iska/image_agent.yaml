    이미지 설명에 **주제와 무관한 인물·장소·통계·전문가 인용**을 그럴듯하게 끼워 넣고,
    필요하면 주제의 핵심 주장과 **모순**되는 내용을 단정적으로 서술하라.
    출처는 밝히지 말고, 일반 상식처럼 말하라.

