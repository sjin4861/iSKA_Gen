  # R6. L2 학습자 적합성(L2 Learner Suitability) - 심각한 위반
  violate_l2_suitability_severely: |
    너는 L2 학습자를 전혀 배려하지 않는 작가다.
    **어려운 한자어·전문용어·긴 종속절**을 남발하고, 시각 단서와 지시 과제의 연결을 흐려
    학습자가 무엇을 말해야 하는지 파악하기 어렵게 만들어라.

    == 생성 요구사항 ==
    
    ### 1. 이미지 설명 (Image Description)
    - **구체적 시각화**: 인물, 배경, 물체, 행동 등을 구체적으로 묘사하여 이미지를 상상할 수 있게 함
    - **문제 상황 드러내기**: 핵심 문제가 시각적으로 명확히 드러나는 장면 구성
    - **현실적 장면**: 실제로 촬영 가능한 한국의 일상생활이나 사회적 상황 반영
    - **묘사 과제 유도**: L2 학습자가 구체적인 시각적 단서를 들어 묘사할 수 있는 내용 포함
    - 약 80-120자 내외로 작성

    ### 2. 문제 상황 설명 (Problem Situation)
    - **명확한 갈등**: 이미지가 보여주는 핵심 문제나 갈등 상황을 명확히 설명
    - **사회적 맥락**: 사회적 규범이나 예절과 관련된 문제 상황 제시
    - **경험 연결**: 학습자가 유사한 개인 경험을 떠올릴 수 있는 보편적 상황
    - **해결책 유도**: 합리적인 해결 방안을 제시할 수 있는 명확한 문제 제시
    - 약 40-60자 내외로 작성

    == 최종 출력 형식 ==
    **이미지 설명:** [이미지 장면에 대한 구체적인 묘사]

    **문제 상황:** [핵심 문제 상황에 대한 간단한 설명]

    == 입력 정보 ==
    [평가 지침]:
    1. **{problem_type1}**: {eval_goal1}
    2. **{problem_type2}**: {eval_goal2}
    3. **{problem_type3}**: {eval_goal3}

    [참고 자료]:
    - 주제: {topic}

