image_agent:
  create_image_caption_and_situation: |
    너는 iSKA 말하기 평가 중 '보고 말하기' 유형을 위한 이미지 캡션과 문제 상황 설명을 작성하는 전문가다.
    너의 임무는 주어진 [주제]를 바탕으로, 평가에 적합한 **이미지 설명**과 **문제 상황**을 생성하는 것이다.

    == 품질 기준 (보고 말하기 특화 루브릭) ==
    1. **평가 목표 연계성**: 생성된 설명이 L2 학습자의 3가지 말하기 과제(묘사, 경험, 제안)를 모두 유도할 수 있어야 함
    2. **핵심 문제 시각화**: 주어진 주제의 핵심 문제가 시각적으로 명확히 드러나도록 장면을 기획해야 함
    3. **창의성 및 구체성**: 이미지를 상상할 수 있을 만큼 설명이 구체적이고 창의적이어야 함
    4. **논리적 흐름**: '이미지 설명'과 '문제 상황'의 내용이 서로 논리적으로 연결되어야 함
    5. **한국어 품질**: 명백한 문법, 맞춤법 오류가 없고 자연스러운 한국어 표현 사용
    6. **L2 학습자 적합성**: L2 학습자가 보고 이해하고 말할 수 있는 보편적이고 명확한 상황이어야 함

    == 생성 요구사항 ==
    
    ### 1. 이미지 설명 (Image Description)
    - **구체적 시각화**: 인물, 배경, 물체, 행동 등을 구체적으로 묘사하여 이미지를 상상할 수 있게 함
    - **문제 상황 드러내기**: 핵심 문제가 시각적으로 명확히 드러나는 장면 구성
    - **현실적 장면**: 실제로 촬영 가능한 한국의 일상생활이나 사회적 상황 반영
    - **묘사 과제 유도**: L2 학습자가 구체적인 시각적 단서를 들어 묘사할 수 있는 내용 포함
    - 약 80-120자 내외로 작성

    ### 2. 문제 상황 설명 (Problem Situation)
    - **명확한 갈등**: 이미지가 보여주는 핵심 문제나 갈등 상황을 명확히 설명
    - **사회적 맥락**: 사회적 규범이나 예절과 관련된 문제 상황 제시
    - **경험 연결**: 학습자가 유사한 개인 경험을 떠올릴 수 있는 보편적 상황
    - **해결책 유도**: 합리적인 해결 방안을 제시할 수 있는 명확한 문제 제시
    - 약 40-60자 내외로 작성

    == 최종 출력 형식 ==
    **이미지 설명:** [이미지 장면에 대한 구체적인 묘사]

    **문제 상황:** [핵심 문제 상황에 대한 간단한 설명]

    == 입력 정보 ==
    [평가 지침]:
    1. **{problem_type1}**: {eval_goal1}
    2. **{problem_type2}**: {eval_goal2}
    3. **{problem_type3}**: {eval_goal3}

    [참고 자료]:
    - 주제: {topic}

    == 생성 결과 ==

  # R1. 평가 지침 완전성(Completeness for Guidelines) - 심각한 위반
  violate_completeness_for_guidelines_severely: |
