# ==================================================
# Ⅲ. 보고 말하기 (이미지+문제 상황 통합) 평가 프롬프트
# ==================================================
rubric_evaluation_visual:

  completeness_for_guidelines: |
    # R1 평가 지침 완전성 (Goal1~3 동시 평가, Binary)

    ## 임무
    다음 [이미지 설명 + 문제 상황]과 세 개의 [문항]이, 각각 대응하는 [평가 목표]를 **모두** 충실히 반영하는지 판정하라.
    - 세 개 중 하나라도 불충분하면 전체 결과를 FAIL로 한다.

    ## 판정 규칙(엄격)
    - PASS: 모든 문항이
        (a) 한 문장으로 간결하게 제시되고,
        (b) 대응하는 평가 목표와 일치하며,
        (c) 주어진 이미지·문제 상황 또는 일반적인 개인 경험을 근거로 답변 가능(외부 전문지식 불필요, 비자명 시각 단서 ≥1 포함).
    - FAIL: 하나라도 다문장/모호, 목표와 불일치, 이미지·문제 상황·개인 경험만으로 답 불가, 또는 특정 목표로 편중.

    ## 출력 형식
    [답변] "PASS" 또는 "FAIL"로 시작하고, 한 줄로 간단한 이유를 설명 (최대 100자)

    ## 입력
    [이미지 설명 + 문제 상황]
    {image_caption}

    [문항 및 평가 지침]
    1) 문항: {stem1}
       평가 지침 1: {problem_type1} — {eval_goal1}

    2) 문항: {stem2}
       평가 지침 2: {problem_type2} — {eval_goal2}

    3) 문항: {stem3}
       평가 지침 3: {problem_type3} — {eval_goal3}

    ## 출력
    [답변]

  visual_theme_salience: |
    # R2 핵심 주제 시각화 (Binary O/X)

    ## 임무
    [이미지 설명 + 문제 상황]이 핵심 주제를 장면/사물/행동 등의 시각 단서로 또렷하게 표현하는지 평가하라.

    ## 판정 기준(엄격)
    - PASS: 핵심 주제가 구체적 시각 요소로 식별 가능(무엇/어디/무슨 행동)
    - FAIL: 하나라도 주제가 시각적으로 흐릿/암시 수준, 핵심 요소 부재

    ## 출력 형식
    [답변] "PASS" 또는 "FAIL"로 시작하고, 한 줄로 간단한 이유를 설명 (최대 100자)

    ## 입력
    [이미지 설명 + 문제 상황]
    {image_caption}

    ## 출력
    [답변]

  image_groundedness: |
    # R3 이미지·문제 상황 기반성 (Binary O/X)

    ## 임무
    [응답 지문]이 제공된 [이미지 설명 + 문제 상황]에 **온전히** 기반하는지 판정하라.
    - 하나라도 근거 없음/상충이면 FAIL.

    ## 판정 기준(엄격)
    - PASS: 제공 정보의 재서술/직접 파생 범위 내 기술
    - FAIL: 설명에 없는 사실·수치·상황 추가, 추정/과장, 상충

    ## 출력 형식
    [답변] "PASS" 또는 "FAIL"로 시작하고, 한 줄로 간단한 이유를 설명 (최대 100자)

    ## 입력
    [응답 지문]
    {response_text}

    [이미지 설명 + 문제 상황]
    {image_caption}

    ## 출력
    [답변]

  visual_reproducibility: |
    # R4 시각적 재현 가능성 (Binary O/X)

    ## 임무
    [이미지 설명]이 사진을 바로 생성할 수 있을 만큼 **구체적**인지 판정하라.

    ## 판정 기준(엄격)
    - PASS: 주체·행동/상태·공간 배치·배경 맥락·광원/시간대·시점/구도·색/수량 등 핵심 요소 다수 포함
    - FAIL: 핵심 요소 누락되어 장면 재현 불가/과도한 추측 필요

    ## 출력 형식
    [답변] "PASS" 또는 "FAIL"로 시작하고, 한 줄로 간단한 이유를 설명 (최대 100자)

    ## 입력
    [이미지 설명 + 문제 상황]
    {image_caption}

    ## 출력
    [답변]

  problem_korean_quality: |
    # R5 문제 상황 한국어 품질 (Binary O/X)

    ## 임무
    [이미지 설명 + 문제 상황]에서 서술된 문법·맞춤법·띄어쓰기·호응 및 표현 명료성을 평가하라.

    ## 판정 기준(엄격)
    - PASS: 오류 없고 명료, 어색한 번역투 없음
    - FAIL: 하나라도 명백한 오류, 어색한 번역투 존재

    ## 출력 형식
    [답변] "PASS" 또는 "FAIL"로 시작하고, 한 줄로 간단한 이유를 설명 (최대 100자)

    ## 입력
    [이미지 설명 + 문제 상황]
    {image_caption}

    ## 출력
    [답변]

  visual_cues_response_suitability: |
    # R6 시각 단서·응답 적합성 (Likert 1~5, content)

    ## 임무
    [이미지 설명 + 문제 상황]이 L2 학습자의 **묘사·경험·제안** 응답을 자연스럽게 유도하는지 평가하라.

    ## 판단 기준(응답 관점)
    - (난이도) 어휘 수준·문장 길이·구문 복잡도가 과도하지 않은가? 관용구·은어·한자어 남용은 감점.
    - (명료성) 암묵적 배경지식 없이도 시각 단서가 이해되도록 설명되는가? 필요한 경우 간단한 정의/예시로 보완되는가?

    ## 척도 앵커
    5 매우 적절 / 4 대체로 적절 / 3 가능하나 방해 요소 / 2 어려운 요소 다수 / 1 매우 어려움

    ## 출력 형식
    [답변] 1~5 중 정수 1개 출력하고, 한 줄로 간단한 이유 설명 (최대 100자)

    ## 입력
    [이미지 설명 + 문제 상황]
    {image_caption}

    ## 출력
    [답변]
