# ==================================================
# Ⅱ. 듣고 말하기 (대화문) 평가 프롬프트
# ==================================================
rubric_evaluation_listening:

  # ---------- R1. 평가 지침 완전성 (Binary, content + stems) ----------
  completeness_for_guidelines: |
    # R1 평가 지침 완전성 (Goal1~3 동시 평가, Binary)

    ## 임무
    다음 [대화 대본]과 세 개의 [문항]이, 각각 대응하는 [평가 목표]를 **모두** 충실히 반영하는지 판정하라.
    - 세 개 중 하나라도 불충분하면 전체 결과를 FAIL로 한다.

    ## 판정 규칙(엄격)
    - PASS: 모든 문항이 
        (a) 한 문장으로 간결하게 제시되고,  
        (b) 대응하는 평가 목표와 일치하며,  
        (c) 대본 내용 또는 일반적인 개인 경험을 근거로 답변 가능(외부 전문지식 불필요).  
    - FAIL: 하나라도 다문장/모호, 목표와 불일치, 대본·개인경험만으로 답 불가, 또는 다른 목표로 편중.

    ## 출력 형식
    [답변] "PASS" 또는 "FAIL"로 시작하고, 한 줄로 간단한 이유를 설명 (최대 100자)

    ## 입력
    [대화 대본]
    {audio_script}

    [문항 및 평가 지침]
    1) 문항: {stem1}
       평가 지침 1: {problem_type1} — {eval_goal1}

    2) 문항: {stem2}
       평가 지침 2: {problem_type2} — {eval_goal2}

    3) 문항: {stem3}
       평가 지침 3: {problem_type3} — {eval_goal3}

    ## 출력
    [답변]

  # ---------- R2. 대화 주제 일관성 (Binary) ----------
  conversation_topic_consistency: |
    # R2 대화 주제 일관성 (Binary O/X)

    ## 임무
    [대화 대본]이 하나의 통일된 주제를 중심으로 전개되는지 평가하라.

    ## 판정 기준(엄격)
    - PASS: 한 문장 요약이 명확하며, 발화 간 응집성이 유지되고 불필요한 주제 전환 없음
    - FAIL: 하나라도 주제가 모호, 산만한 전환 다수, 발화 간 연결 약함

    ## 출력 형식
    [답변] "PASS" 또는 "FAIL"로 시작하고, 한 줄로 간단한 이유를 설명 (최대 100자)

    ## 입력
    [대화 대본]
    {audio_script}

    ## 출력
    [답변]

  # ---------- R3. 배경 정보 기반성 (Binary) ----------
  background_consistency: |
    # R3 배경 정보 기반성 (Binary O/X)

    ## 임무
    [대화 대본]이 제공된 [배경 정보]와 일치하는지 판정하라.
    - 하나라도 근거 없음/상충이면 FAIL.

    ## 판정 기준(엄격)
    - PASS: 배경 정보의 재서술/직접 파생 범위 내에서만 기술됨
    - FAIL: 배경 정보에 없는 사실·수치·사례·평가 추가, 추정/과장, 상충

    ## 출력 형식
    [답변] "PASS" 또는 "FAIL"로 시작하고, 한 줄로 간단한 이유를 설명 (최대 100자)

    ## 입력
    [대화 대본]
    {audio_script}

    [배경 정보]
    {background_info}

    ## 출력
    [답변]

  # ---------- R4. 대화의 흐름 및 구조 (Binary) ----------
  dialogue_flow_and_structure: |
    # R4 대화의 흐름 및 구조 (Binary O/X)

    ## 임무
    화자 간 상호작용이 '문제 제기 → 논거 제시 → 반박(또는 합의)'의 자연스러운 흐름을 따르는지 평가하라.

    ## 판정 기준(엄격)
    - PASS: 차례가 논리적이며 전환이 매끄럽고, 단순 발화 나열이 아님
    - FAIL: 하나라도 흐름 단절, 비약, 단순 나열이면 FAIL

    ## 출력 형식
    [답변] "PASS" 또는 "FAIL"로 시작하고, 한 줄로 간단한 이유를 설명 (최대 100자)

    ## 입력
    [대화 대본]
    {audio_script}

    ## 출력
    [답변]

  # ---------- R5. 한국어 품질 (Binary) ----------
  korean_quality: |
    # R5 한국어 품질 (Binary O/X)

    ## 임무
    [대화 대본]의 문법·맞춤법·띄어쓰기·호응 및 표현 자연스러움을 평가하라.

    ## 판정 기준(엄격)
    - PASS: 오류 없고 구어체로 자연스러움(과도한 문어체/번역투 없음)
    - FAIL: 하나라도 명백한 오류, 과도한 문어체/번역투, 부자연스러움 존재

    ## 출력 형식
    [답변] "PASS" 또는 "FAIL"로 시작하고, 한 줄로 간단한 이유를 설명 (최대 100자)

    ## 입력
    [대화 대본]
    {audio_script}

    ## 출력
    [답변]

  # ---------- R6. 구어체·응답 적합성 (Likert 1~5, content + stems) ----------
  colloquial_response_suitability: |
    # R6 구어체·응답 적합성 (Likert 1~5, content)

    ## 임무
    [대화 대본]이 L2 학습자의 **응답 수행**에 적절한지 평가하라.

    ## 판단 기준(응답 관점)
    - (난이도) 어휘 수준·문장 길이·구문 복잡도가 과도하지 않은가? 구어체 축약·속담·은어 남용은 감점
    - (명료성) 암묵적 배경지식 의존 없이 의미가 전달되는가? 필요한 경우 간단한 정의·예시로 해소되는가?

    ## 척도 앵커
    5 매우 적절 / 4 대체로 적절 / 3 가능하나 방해 요소 있음 / 2 어려운 요소 다수 / 1 매우 어려움

    ## 출력 형식
    [답변] 1~5 중 정수 1개 출력하고, 한 줄로 간단한 이유 설명 (최대 100자)

    ## 입력
    [대화 대본]
    {audio_script}

    ## 출력
    [답변]
