# iSKA 한국어 말하기 평가의 지문 생성을 위한 프롬프트
# 최종 수정: 2025-07-17

passage_agent:
  create_passage: |
    너는 iSKA 말하기 평가용 지문을 작성하는 최고의 전문가다.
    너의 임무는 주어진 [참고 자료]를 바탕으로, 아래 [평가 지침] 3가지를 모두 충족하는 **하나의 통합된 지문**을 생성하는 것이다.
    이 지문은 외국인 한국어 학습자가 이해하기 쉬운 평이한 문체로 작성되어야 하며, 약 300자 내외의 길이를 가져야 한다.
    
    == 중요한 출력 규칙 ==
    1. **제목을 절대 포함하지 마라**. 지문 내용만 작성하라.
    2. 최종 결과는 하나의 문단으로 구성된 지문만 포함해야 하며, 다른 부가적인 설명이나 제목은 절대 추가하지 마라.
    3. "제목:", "**제목**", "Title:" 등 제목을 나타내는 어떤 표현도 사용하지 마라.

    == 출력 형식 ==
    [지문]: "지문 내용만..."

    == 평가 지침 ==
    1. **{problem_type1}**: {eval_goal1}
    2. **{problem_type2}**: {eval_goal2}
    3. **{problem_type3}**: {eval_goal3}

    == 참고 자료 ==
    [자료 1: {korean_topic}]
    {korean_context}

    [자료 2: {foreign_topic}]
    {foreign_context}

    == 지시사항 ==
    step 1: 먼저, 위 3가지 '생성 목표'를 모두 만족시키기 위해 어떤 내용을 포함해야 할지 분석한다.
    step 2: 분석한 내용을 바탕으로, 두 문화의 특징이 잘 드러나면서도 3가지 유형의 질문을 모두 출제할 수 있는 풍부한 내용의 지문을 작성한다.
    step 3: 지문은 반드시 하나의 자연스럽고 논리적인 단락으로 구성되어야 한다. 외국인 한국어 학습자가 이해하기 쉬운 평이한 문체를 사용하고, 약 300자 내외로 작성한다.
    step 4: **제목 없이 지문 내용만 작성한다.**

    == 출력 ==
    [지문]: 


  create_passage_rubric_aware: |
    너는 iSKA 말하기 평가용 지문을 작성하는 최고의 AI 교육 전문가다.
    너의 임무는 주어진 [참고 자료]와 [평가 지침]을 바탕으로, 아래 **6가지 [품질 기준]을 모두 완벽하게 충족하는** 하나의 통합된 지문을 생성하는 것이다.

    == 품질 기준 (Rubrics) ==

    ### Ⅰ. 기획 의도 부합성
    1.  **평가 지침 완전성:** 지문은 주어진 3개의 '평가 지침' 각각에 대한 질문을 모두 만들 수 있도록, 충분하고 균형 잡힌 정보를 포함해야 한다.
    2.  **핵심 주제 명확성:** 지문은 '참고 자료'를 중심으로, 핵심 메시지를 명확하게 전달해야 한다.

    ### Ⅱ. 내용의 신뢰성 및 품질
    3.  **참고 자료 기반성:** 지문의 모든 내용은 제공된 '참고 자료'에 의해서만 뒷받침되어야 하며, 자료에 없거나 상충하는 내용을 포함해서는 안 된다 (환각 금지).
    4.  **논리적 흐름 및 구조:** 지문은 '도입-본론-결론'의 명확한 구조를 가지며, 문장 간 연결이 자연스러워야 한다. (단순 정보 나열 금지)

    ### Ⅲ. 언어적 표현 및 교육적 적합성
    5.  **한국어 품질:** 명백한 문법/맞춤법 오류나 어색한 번역투 표현이 없어야 한다.
    6.  **L2 학습자 적합성:** 어휘 수준과 문장 복잡도가 L2 학습자에게 적절해야 하며, 설명 없이 이해하기 어려운 전문 용어는 피해야 한다.

    == 최종 출력 형식 ==
    - 제목 없이, 반드시 약 300자 내외의 최대한 간결하게 지문 단락 하나만 출력한다.
    - 다른 부가적인 설명은 절대 추가하지 마라. 
    - 지문은 즉시 시험 문제에 반영될 것이므로 네 생각 등을 담으면 안 된다. 

    == 입력 정보 ==

    [평가 지침 (이 지문으로 만들 문제의 방향)]:
    1. **{problem_type1}**: {eval_goal1}
    2. **{problem_type2}**: {eval_goal2}
    3. **{problem_type3}**: {eval_goal3}

    [참고 자료]:
    - Home Topic ({korean_topic}): {korean_context}
    - Foreign Topic ({foreign_topic}): {foreign_context}

    [생성될 지문]:

  # 4. 논리적 흐름 및 구조 (Logical Flow & Structure) - 심각한 위반
  violate_flow_severely: |
    너는 실험적인 글쓰기를 즐기는 작가다.
    주어진 [참고 자료]를 바탕으로 지문을 생성하되, **의도적으로 문장들의 순서를 뒤섞어라.** 예를 들어, 결론 부분을 먼저 쓰고, 중간 내용을 쓴 뒤, 마지막에 도입부를 쓰는 방식으로 구성하여 글 전체의 논리적 흐름을 완전히 파괴해야 한다.

    == 최종 출력 형식 ==
    - 제목 없이, 약 300자 내외의 지문 단락 하나만 출력한다.
    - 다른 부가적인 설명은 절대 추가하지 마라.

    == 입력 정보 ==
    [평가 지침]:
    1. **{problem_type1}**: {eval_goal1}
    2. **{problem_type2}**: {eval_goal2}
    3. **{problem_type3}**: {eval_goal3}
    [참고 자료]:
    - Home Topic ({korean_topic}): {korean_context}
    - Foreign Topic ({foreign_topic}): {foreign_context}
    [생성될 지문]:

  # 5. 한국어 품질 (Korean Quality) - 심각한 위반
  violate_korean_quality_severely: |
    너는 성능이 매우 나쁜 기계 번역기다.
    주어진 [참고 자료]를 바탕으로 지문을 생성하되, **심각한 문법 오류, 어색한 직역체, 부적절한 영어 단어 남용** 등을 의도적으로 많이 포함하여, 누가 봐도 기계가 번역한 것처럼 보이는 저품질의 한국어 지문을 생성하라.

    == 최종 출력 형식 ==
    - 제목 없이, 약 300자 내외의 지문 단락 하나만 출력한다.
    - 다른 부가적인 설명은 절대 추가하지 마라.

    == 입력 정보 ==
    [평가 지침]:
    1. **{problem_type1}**: {eval_goal1}
    2. **{problem_type2}**: {eval_goal2}
    3. **{problem_type3}**: {eval_goal3}
    [참고 자료]:
    - Home Topic ({korean_topic}): {korean_context}
    - Foreign Topic ({foreign_topic}): {foreign_context}
    [생성될 지문]:

  # 6. L2 학습자 적합성 (L2 Learner Suitability) - 심각한 위반
  violate_l2_suitability_severely: |
    너는 자신의 지식을 과시하기 좋아하는, 외국인 학습자를 전혀 배려하지 않는 학자다.
    주어진 [참고 자료]를 바탕으로 지문을 생성하되, **의도적으로 매우 어려운 전문 용어, 현학적인 한자어, 복잡하고 긴 문장 구조를 남용**하여, L2 학습자가 절대로 이해할 수 없는 난해한 지문을 생성하라.

    == 최종 출력 형식 ==
    - 제목 없이, 약 300자 내외의 지문 단락 하나만 출력한다.
    - 다른 부가적인 설명은 절대 추가하지 마라.

    == 입력 정보 ==
    [평가 지침]:
    1. **{problem_type1}**: {eval_goal1}
    2. **{problem_type2}**: {eval_goal2}
    3. **{problem_type3}**: {eval_goal3}
    [참고 자료]:
    - Home Topic ({korean_topic}): {korean_context}
    - Foreign Topic ({foreign_topic}): {foreign_context}
    [생성될 지문]:

  create_dialogue_passage: |
    너는 iSKA 말하기 평가용 대화형 지문을 작성하는 최고의 전문가다.
    너의 임무는 주어진 [참고 자료]를 바탕으로, 아래 [평가 지침] 3가지를 모두 충족하는 **자연스러운 대화형 지문**을 생성하는 것이다.

    == 대화 형식 요구사항 ==
    1. **화자**: 남자와 여자 두 명이 대화한다.
    2. **발화 횟수**: 각자 정확히 3번씩 말한다 (총 6개 발화).
    3. **대화 흐름**: 
       - 1-2번째 발화: 문제 제기 및 서로 다른 입장 표명
       - 3-4번째 발화: 각자의 논거와 근거 제시
       - 5-6번째 발화: 상대방 의견에 대한 반박 또는 재반박
    4. **자연스러움**: 실제 대화처럼 자연스럽고 현실적이어야 한다.

    == 품질 기준 ==
    - **평가 지침 완전성**: 대화 내용이 주어진 3개의 평가 지침 각각에 대한 질문을 모두 만들 수 있는 내용 포함
    - **핵심 주제 명확성**: 대화가 하나의 통일되고 명확한 핵심 주제에 집중하고 있음
    - **배경 정보 기반성**: 대화 내용이 주어진 배경 정보와 일치하며, 배경 정보에 없는 내용을 임의로 추가하지 않음
    - **대화의 흐름 및 구조**: 대화가 '문제 제기 → 논거 제시 → 반박'의 자연스러운 흐름을 따르며, 화자 간의 상호작용이 논리적으로 연결됨
    - **한국어 품질**: 대화에 문법, 맞춤법 오류가 없으며, 구어체 문법이 올바르게 사용됨
    - **구어체 적합성**: 딱딱한 문어체가 아닌, L2 학습자가 이해할 수 있는 자연스러운 구어체로 작성

    == 최종 출력 형식 ==
    남자: [첫 번째 발화]
    여자: [첫 번째 발화]
    남자: [두 번째 발화]
    여자: [두 번째 발화]
    남자: [세 번째 발화]
    여자: [세 번째 발화]

    == 입력 정보 ==
    [평가 지침]:
    1. **{problem_type1}**: {eval_goal1}
    2. **{problem_type2}**: {eval_goal2}
    3. **{problem_type3}**: {eval_goal3}

    [참고 자료]:
    - 주제: {topic}
    - 배경 정보: {context}

    [생성될 대화형 지문]:

