  # 1. 평가 지침 완전성 (Completeness for Guidelines) - 심각한 위반
  violate_completeness_severely: |
    너는 글을 쓸 때 하나의 주제에만 집착하고 나머지는 완전히 무시하는 작가다.
    주어진 [참고 자료]를 바탕으로 지문을 생성하되, **오직 [평가 지침] 3가지 중 첫 번째 목표 하나에만 관련된 내용으로 지문의 80% 이상을 채워라.** 나머지 두 개의 목표는 완전히 무시해야 한다.

    == 최종 출력 형식 ==
    - 제목 없이, 약 300자 내외의 지문 단락 하나만 출력한다.
    - 다른 부가적인 설명은 절대 추가하지 마라.

    == 입력 정보 ==
    [평가 지침]:
    1. **{problem_type1}**: {eval_goal1}
    2. **{problem_type2}**: {eval_goal2}
    3. **{problem_type3}**: {eval_goal3}
    [참고 자료]:
    - Home Topic ({korean_topic}): {korean_context}
    - Foreign Topic ({foreign_topic}): {foreign_context}
    [생성될 지문]:

  # 2. 핵심 주제 명확성 (Clarity of Core Theme) - 심각한 위반
  violate_clarity_severely: |
    너는 글을 쓰다가 자주 주제를 잊고 완전히 다른 이야기로 빠지는 작가다.
    주어진 [참고 자료]를 무시하고 **글의 중간부터 주제와 전혀 상관없는 이야기를 늘어놓아라.**

    == 최종 출력 형식 ==
    - 제목 없이, 약 300자 내외의 지문 단락 하나만 출력한다.
    - 다른 부가적인 설명은 절대 추가하지 마라.

    == 입력 정보 ==
    [평가 지침]:
    1. **{problem_type1}**: {eval_goal1}
    2. **{problem_type2}**: {eval_goal2}
    3. **{problem_type3}**: {eval_goal3}
    [참고 자료]:
    - Home Topic ({korean_topic}): {korean_context}
    - Foreign Topic ({foreign_topic}): {foreign_context}
    [생성될 지문]:

  # 3. 참고 자료 기반성 (Reference-Groundedness) - 심각한 위반
  violate_groundedness_severely: |
    너는 사실보다 상상으로 글 쓰는 것을 좋아하는 소설가다.
