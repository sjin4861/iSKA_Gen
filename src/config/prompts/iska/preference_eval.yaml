# iSKA RM 훈련을 위한 쌍대 비교(Pairwise) 평가 프롬프트
# 최종 수정: 2025-08-18

preference_evaluation:
  # 1) 평가 지침 완전성 (Content + Stems)
  completeness_for_guidelines: |
    아래 [지문]과 [문항 세트]가 주어집니다. 또한 이 과업의 [평가 지침]이 제공됩니다.
    당신의 임무는 지문이 3가지 지침을 모두 충족하도록 충분하고 균형 잡힌 정보를 포함하는지,
    그리고 각 문항(stem)이 지문에 근거해 **무리 없이 출제 가능한지**를 점검하는 것입니다.

    [평가 지침]
    - 문제 유형: {problem_type1}, {problem_type2}, {problem_type3}
    - 평가 목표: {eval_goal1}, {eval_goal2}, {eval_goal3}

    [평가 기준]
    - (충족성) 지문이 3가지 문제 유형 모두에 대해 **질문을 만들고 답하게 할** 핵심 정보(근거)를 고르게 포함하는가?
    - (정합성) 각 stem이 해당 문제 유형/평가 목표와 **정확히 대응**하며, 지문 정보만으로 답변이 가능한가?
    - (과잉/결손) 특정 과업에만 치우치거나, 불필요한 주변 서술로 본론 정보가 희석되면 감점.

    위 기준에 따라 [지문]의 지침 완전성과 [문항 세트]와의 정합성 여부를 평가하세요.

  # 2) 핵심 주제 명확성 (Content Only)
  clarity_of_core_theme: |
    아래 [지문]이 주어집니다.

    [평가 기준]
    - 핵심 메시지가 초반에 분명히 설정되고, 전개와 정리에서 **일관되게 유지**되는가?
    - 산만한 소주제 나열, 주제 이탈, 불명확한 결론·요지 재확인은 감점.
    - 분량·문체 차이는 배제하고 **주제 집중도**만 본다.

    위 기준에 따라 [지문]이 하나의 **명확하고 일관된 핵심 메시지**를 중심으로 전개되는지 평가하세요.


  # 3) 참고 자료 기반성 (Content Only + Reference 단일화)
  reference_groundedness: |
    아래 [지문]과 [참고 자료]가 주어집니다.

    [참고 자료]
    - {reference}
    
    [판정 규칙(엄격)]
    - PASS: 참고 자료의 재서술/직접 파생 범위 내에서만 기술됨.
    - FAIL: 자료에 없는 사실·수치·사례·인용 추가, 과장/추정, 혹은 자료와 상충.

    위 기준에 따라 [지문]의 모든 진술이 [참고 자료] 범위 안에서 **직접 재서술/합리적 파생**되는지 엄격히 평가하세요.


  # 4) 논리적 흐름 및 구조 (Content Only)
  logical_flow: |
    아래 [지문]이 주어집니다.

    [평가 기준]
    - 도입에서 주제·맥락 제시, 전개에서 근거·예시·대조, 결론에서 요지 재확인/시사점 정리가 명확한가?
    - 접속어·지시어·인과/대조 전개가 자연스러운가?
    - 단순 정보 나열, 순서 뒤바뀜, 비약적 결론은 감점.

    위 기준에 따라 [지문]의 **도입→전개→정리(결론)** 구조와 문장·문단 간 연결의 자연스러움을 평가하세요.


  # 5) 한국어 품질 (Content Only)
  korean_quality: |
    아래 [지문]이 주어집니다.

    [평가 기준]
    - 문법·맞춤법·띄어쓰기·조사 사용의 정확성
    - 번역투/어색한 표현 최소화, 중복·장황 문장 지양, 어휘 선택의 자연스러움
    - 의미 모호성·지시 대상 불명확·문장 파편화가 있으면 감점

    위 기준에 따라 [지문]의 한국어 문법·맞춤법·어휘 자연스러움 관점에서 언어 품질을 평가하세요.

  # 6) L2 학습자 적합성 (Content + Stems)
  l2_learner_suitability: |
    아래 [지문]과 [문항 세트]가 주어집니다.

    [평가 기준]
    - (난이도) 어휘 수준·문장 길이·구문 복잡도가 과도하지 않은가?
    - (명료성) 전문 용어·암묵적 배경지식 의존을 피하고, 필요한 경우 간단한 정의/예시로 해소되는가?
    - (문항 적합성) 각 stem이 **명확하고 과도한 추론을 요구하지 않으며**, 지문 근거로 답할 수 있는가?

    위 기준에 따라 [지문]과 [문항 세트]를 L2 한국어 학습자를 가정하여 적절한 난이도·표현·구조인지 평가하세요.
