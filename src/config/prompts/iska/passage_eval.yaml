    - false: 목표 관련 정보가 피상적·암시적이거나, 일반론적 문장만 있음 / 목표와 무관함 / 다른 목표에 과도 편중되어 본 목표가 성립하지 않음.
    
    ## 입력
    * 문제 유형 2: {problem_type2}
    * 평가 목표 2: {eval_goal2}
    **생성된 지문:**
    {passage}

    ## 출력 형식
    true 또는 false만 출력.

