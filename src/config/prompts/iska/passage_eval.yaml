# iSKA 한국어 말하기 평가 프롬프트 (Binary + Likert)
# 최종 수정: 2025-08-10

passage_eval:
  # =========================
  # [Binary - 공통(읽고 말하기)]
  # =========================
  completeness_for_guideline1_binary: |
    # 평가 지침 완전성(Goal 1) - 이진 평가

    ## 역할
    당신은 교육 평가 전문가다. `평가 목표 1`을 기준으로 `생성된 지문`이 **질문을 만들 수 있을 만큼**의 구체 정보를 담는지 O/X로 판정한다.

    ## 판단 규칙(엄격)
    - true: 지문에 `평가 목표 1`을 직접적으로 뒷받침하는 분명한 단서가 1개 이상 존재하여, 외부 지식 없이 질문을 출제 가능.
    - false: 목표 관련 정보가 피상적·암시적이거나, 일반론적 문장만 있음 / 목표와 무관함 / 다른 목표에 과도 편중되어 본 목표가 성립하지 않음.

    ## 입력
    * 문제 유형 1: {problem_type1}
    * 평가 목표 1: {eval_goal1}
    **생성된 지문:**
    {passage}

    ## 출력 형식
    true 또는 false만 출력.

