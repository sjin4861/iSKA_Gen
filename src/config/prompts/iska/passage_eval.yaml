  reference_groundedness_binary: |
    # 참고 자료 기반성 - 이진 평가

    ## 역할
    사실 검증 전문가로서, `생성된 지문`의 모든 내용이 **제공된 참고 자료에만** 근거하는지 O/X로 판정한다.

    ## 판단 규칙(중요)
    - 허용: 참고 자료의 요약/재서술/직접 파생되는 상식적 연결.
    - 불허: 자료에 **명시되지 않은** 사실·수치·사례·평가·비유, 외부 지식 보완, 추정·과장.
    - 충돌: 자료와 상충 1개라도 있으면 false.

    ## 입력
    **참고 자료:**
    - 한국 문화 ({korean_topic}): {korean_context}
    - 외국 문화 ({foreign_topic}): {foreign_context}
    **생성된 지문:**
    {passage}

    ## 출력 형식
    true 또는 false만 출력.

  # =========================
  # [Likert - 공통(읽고 말하기)]
  # =========================
  clarity_of_core_theme_likert: |
    # 핵심 주제 명확성 - 리커트(1~5)

    ## 판단 기준
    하나의 통일된 핵심 메시지로 일관되는가? 주변·탈선 내용이 흐름을 해치지 않는가?

    ## 척도 앵커
    5 매우 명확 / 4 대체로 명확(약간의 주변 요소) / 3 파악 가능하나 군더더기 있음 / 2 다주제 혼재·모호 / 1 파악 불가

    **생성된 지문:**
    {passage}

    ## 출력 형식
    1~5 중 정수만 출력.

  logical_flow_likert: |
    # 논리적 흐름 및 구조 - 리커트(1~5)

    ## 판단 기준
    도입-본론-결론 구조, 문장·문단 연결의 자연스러움, 단순 나열 여부.

    ## 척도 앵커
    5 매우 논리적 / 4 대체로 논리적(소폭 비약) / 3 기본 구조 있으나 연결 미흡 / 2 구조 불분명 / 1 구조 부재

    **생성된 지문:**
    {passage}

    ## 출력 형식
    1~5 중 정수만 출력.

  korean_quality_likert: |
    # 한국어 품질 - 리커트(1~5)

    ## 판단 기준
    문법·맞춤법·띄어쓰기·구두점·호응, 번역투/어색한 표현, 문장 길이·호흡.

    ## 척도 앵커
    5 오류 없음·매우 자연 / 4 사소한 오류 1~2 / 3 의미 전달 가능하나 눈에 띄는 오류 / 2 오류 다수·번역투 / 1 이해 곤란

    **생성된 지문:**
    {passage}

    ## 출력 형식
    1~5 중 정수만 출력.

  l2_learner_suitability_likert: |
    # L2 학습자 적합성 - 리커트(1~5)

    ## 판단 기준
    어휘 난이도·문장 복잡도, 배경지식 의존도(권장: TOPIK 3~5 수준).

    ## 척도 앵커
    5 매우 적절 / 4 대체로 적절(일부 어려움) / 3 대체로 가능하나 방해 요소 몇 가지 / 2 어려운 요소 다수 / 1 매우 어려움

    **생성된 지문:**
    {passage}

    ## 출력 형식
    1~5 중 정수만 출력.

  # =========================
  # [Binary 집계 출력(JSON) - 공통]
  # =========================
  binary_rubric_common: |
    # 이진 집계(JSON만 출력) - 공통(읽고 말하기)

    ## 임무
    아래 4항목을 평가해 한 줄 JSON으로만 출력한다.
    - is_guideline1_complete
    - is_guideline2_complete
    - is_guideline3_complete
    - is_reference_grounded
    - feedback(하나라도 false면 이유 1~2문장, 최대 120자 / 모두 true면 "")

    ## 입력
    [평가 지침]
    1. {problem_type1}: {eval_goal1}
    2. {problem_type2}: {eval_goal2}
    3. {problem_type3}: {eval_goal3}

    [참고 자료]
    - 한국 문화 ({korean_topic}): {korean_context}
    - 외국 문화 ({foreign_topic}): {foreign_context}

    [생성된 지문]
    {passage}

    ## 출력 형식(한 줄 JSON, ASCII 쌍따옴표)
    {"is_guideline1_complete": <true/false>,
     "is_guideline2_complete": <true/false>,
     "is_guideline3_complete": <true/false>,
     "is_reference_grounded": <true/false>,
     "feedback": "<모두 true면 빈 문자열, 아니면 간결한 이유>"}

  binary_rubric_common_strict: |
    # 이진 집계(JSON) - 엄격 모드

    ## 규칙
    기준에 **조금이라도 미달/의심**되면 false. 출력 스키마는 공통과 동일.

    (입력 블록은 binary_rubric_common과 동일)

    ## 출력 형식
    {"is_guideline1_complete": <true/false>,
     "is_guideline2_complete": <true/false>,
     "is_guideline3_complete": <true/false>,
     "is_reference_grounded": <true/false>,
     "feedback": "<최대 120자. 모두 true면 "">"}