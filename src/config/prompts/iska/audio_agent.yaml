# ===== Audio Script (Dialogue) Templates =====

audio_agent:
  create_dialogue_passage: |
    너는 iSKA 말하기 평가용 대화형 지문을 작성하는 최고의 전문가다.
    너의 임무는 주어진 [참고 자료]를 바탕으로, 아래 [평가 지침] 3가지를 모두 충족하는 **자연스러운 대화형 지문**을 생성하는 것이다.

    == 대화 형식 요구사항 ==
    1. **화자**: 남자와 여자 두 명이 대화한다.
    2. **발화 횟수**: 각자 정확히 3번씩 말한다 (총 6개 발화).
    3. **대화 흐름**: 
       - 1-2번째 발화: 문제 제기 및 서로 다른 입장 표명
       - 3-4번째 발화: 각자의 논거와 근거 제시
       - 5-6번째 발화: 상대방 의견에 대한 반박 또는 재반박
    4. **자연스러움**: 실제 대화처럼 자연스럽고 현실적이어야 한다.

    == 품질 기준 ==
    - **평가 지침 완전성**: 대화 내용이 주어진 3개의 평가 지침 각각에 대한 질문을 모두 만들 수 있는 내용 포함
    - **핵심 주제 명확성**: 대화가 하나의 통일되고 명확한 핵심 주제에 집중하고 있음
    - **배경 정보 기반성**: 대화 내용이 주어진 배경 정보와 일치하며, 배경 정보에 없는 내용을 임의로 추가하지 않음
    - **대화의 흐름 및 구조**: 대화가 '문제 제기 → 논거 제시 → 반박'의 자연스러운 흐름을 따르며, 화자 간의 상호작용이 논리적으로 연결됨
    - **한국어 품질**: 대화에 문법, 맞춤법 오류가 없으며, 구어체 문법이 올바르게 사용됨
    - **구어체 적합성**: 딱딱한 문어체가 아닌, L2 학습자가 이해할 수 있는 자연스러운 구어체로 작성

    == 최종 출력 형식 ==
    남자: [첫 번째 발화]
    여자: [첫 번째 발화]
    남자: [두 번째 발화]
    여자: [두 번째 발화]
    남자: [세 번째 발화]
    여자: [세 번째 발화]

    == 입력 정보 ==
    [평가 지침]:
    1. **{problem_type1}**: {eval_goal1}
    2. **{problem_type2}**: {eval_goal2}
    3. **{problem_type3}**: {eval_goal3}

    [참고 자료]:
    - 주제: {topic}
    - 배경 정보: {context}

    [생성될 대화형 지문]:

  # ----- (R1) 평가 지침 완전성 위반: Dialogue 버전 -----
  violate_completeness_for_guidelines_severely_dialogue: |
    너는 [평가 지침]을 일부러 불완전하게 따르는 작가다.
    대화를 6턴 형식으로 작성하되, 3개의 평가 지침 중 **1~2개는 아예 건드리지 않거나 엉뚱한 방향**으로 빗나가라.
    질문을 만들 단서가 부족하도록 핵심 정보를 흐리게 제시하고, 주변부 일화로 분량을 채워라.

    == 최종 출력 형식 ==
    남자: [첫 번째 발화]
    여자: [첫 번째 발화]
    남자: [두 번째 발화]
    여자: [두 번째 발화]
    남자: [세 번째 발화]
    여자: [세 번째 발화]

    == 입력 정보 ==
    [평가 지침]:
    1. **{problem_type1}**: {eval_goal1}
    2. **{problem_type2}**: {eval_goal2}
    3. **{problem_type3}**: {eval_goal3}

    [참고 자료]:
    - 주제: {topic}
    - 배경 정보: {context}

    [생성될 대화형 지문]:

  # ----- (R2) 핵심 주제 명확성 위반: Dialogue 버전 -----
  violate_clarity_of_core_theme_severely_dialogue: |
    너는 대화의 초점을 흐트러뜨리는 작가다.
    하나의 통일된 주제에 **집중하지 말고**, 턴마다 **새로운 화제**를 꺼내거나
    서로 상관없는 소주제를 교차시켜 **주제 일관성을 깨라**.
    결론·서론·본론의 경계를 흐리고, 중심 키워드는 회피하라.

    == 최종 출력 형식 ==
    남자: [첫 번째 발화]
    여자: [첫 번째 발화]
    남자: [두 번째 발화]
    여자: [두 번째 발화]
    남자: [세 번째 발화]
    여자: [세 번째 발화]

    == 입력 정보 ==
    [평가 지침]:
    1. **{problem_type1}**: {eval_goal1}
    2. **{problem_type2}**: {eval_goal2}
    3. **{problem_type3}**: {eval_goal3}

    [참고 자료]:
    - 주제: {topic}
    - 배경 정보: {context}

    [생성될 대화형 지문]:

  # ----- (R3) 참고 자료 기반성 위반: Dialogue 버전 -----
  violate_reference_groundedness_severely_dialogue: |
    너는 [참고 자료]에 **의존하지 않는** 작가다.
    대화 속에서 자료에 없는 사례·숫자·전문가 인용을 **그럴듯하게 지어내고**,
    가능하면 [참고 자료]의 핵심 주장과 **모순**되는 내용을 단정적으로 말하라.
    출처는 밝히지 말고, 일반 상식처럼 서술하라.

    == 최종 출력 형식 ==
    남자: [첫 번째 발화]
    여자: [첫 번째 발화]
    남자: [두 번째 발화]
    여자: [두 번째 발화]
    남자: [세 번째 발화]
    여자: [세 번째 발화]

    == 입력 정보 ==
    [평가 지침]:
    1. **{problem_type1}**: {eval_goal1}
    2. **{problem_type2}**: {eval_goal2}
    3. **{problem_type3}**: {eval_goal3}

    [참고 자료]:
    - 주제: {topic}
    - 배경 정보: {context}

    [생성될 대화형 지문]:

  # ----- (R4) 논리적 흐름 및 구조 위반: Dialogue 버전 -----
  violate_flow_severely_dialogue: |
    너는 대화의 논리적 흐름을 깨뜨리는 작가다.
    ‘문제 제기 → 근거 제시 → 반박’ 순서를 **어지럽히고**, 결론을 먼저 말하거나
    반박을 초반에 던지는 등 **비선형 순서**로 배치하라.
    발화 간 연결고리를 약하게 만들어 **비약과 비논리**를 유발하라.

    == 최종 출력 형식 ==
    남자: [첫 번째 발화]
    여자: [첫 번째 발화]
    남자: [두 번째 발화]
    여자: [두 번째 발화]
    남자: [세 번째 발화]
    여자: [세 번째 발화]

    == 입력 정보 ==
    [평가 지침]:
    1. **{problem_type1}**: {eval_goal1}
    2. **{problem_type2}**: {eval_goal2}
    3. **{problem_type3}**: {eval_goal3}

    [참고 자료]:
    - 주제: {topic}
    - 배경 정보: {context}

    [생성될 대화형 지문]:

  # ----- (R5) 한국어 품질 위반: Dialogue 버전 -----
  violate_korean_quality_severely_dialogue: |
    너는 **문법적으로 어색한** 구어체를 쓰는 작가다.
    어색한 직역체, 잘못된 조사·어미, 영어 단어 남용 등을 적극 활용해
    **저품질 한국어 대화**를 만들어라. 다만 대화 형식(6턴)은 유지하라.

    == 최종 출력 형식 ==
    남자: [첫 번째 발화]
    여자: [첫 번째 발화]
    남자: [두 번째 발화]
    여자: [두 번째 발화]
    남자: [세 번째 발화]
    여자: [세 번째 발화]

    == 입력 정보 ==
    [평가 지침]:
    1. **{problem_type1}**: {eval_goal1}
    2. **{problem_type2}**: {eval_goal2}
    3. **{problem_type3}**: {eval_goal3}

    [참고 자료]:
    - 주제: {topic}
    - 배경 정보: {context}

    [생성될 대화형 지문]:

