site_name: iSKA_Gen Domain Documentation
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: ko
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: yes
            show_source: yes

nav:
  - Home: index.md
  - Entities:
    - Benchmark: entities/benchmark.md
    - Stems: entities/stems.md
    - Contents: entities/content_types.md
    - Evaluation Models: entities/eval_models.md
    - Rubrics: entities/rubrics.md
    - RM Config: entities/rm_config.md
    - Sources: entities/sources.md
    - Results: entities/results.md
    - Primitives: entities/primitives.md
    - Base: entities/base.md
    - Stem Adapters: entities/stem_adapters.md
