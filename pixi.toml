[workspace]
authors = ["sjin4861 <sjin4861@postech.ac.kr>"]
channels = ["conda-forge", "pytorch", "nvidia"]
name = "iSKA_Gen"
platforms = ["linux-64"]
version = "0.1.0"

[activation]
env = { PYTHONPATH = "src" }

[tasks]

[dependencies]
setuptools = ">=79,<80"
pip = "<=24.2"
wheel = "<=0.44.0"

python = ">=3.10,<3.13"
ipykernel = ">=6.29.5,<7"
ipywidgets = ">=8.1.7,<9"
jupyterlab = ">=4.4.5,<5"
gh = ">=2.76.1,<3"
numpy = "==2.2.6"
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.6.16,<10"
mkdocstrings = ">=0.30.0,<0.31"
mkdocstrings-python = ">=1.16.12,<2"

[pypi-dependencies]  # pip
openai = "==1.99.9"
pillow = ">=10.3,<11"
accelerate = ">=0.33"
safetensors = ">=0.4"
tiktoken = ">=0.7"
bitsandbytes = ">=0.43"
trl = ">=0.20.0,<0.21"
peft = ">=0.16.0,<0.17"
kaleido = ">=1.0.0"
tensorboard = ">=2.20.0,<3"
plotly = ">=6.2.0,<7"

# PyTorch GPU via PyPI (CUDA 12.8 wheels)
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.22.1", index = "https://download.pytorch.org/whl/cu128" }
torchaudio = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cu128" }
